name: Daily update

on:
  schedule:
    - cron: "17 22 * * *"   # every day at 22:17 UTC, after the US market close
  workflow_dispatch:         # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Commits are authored with your GitHub noreply email so they count on your contribution graph.
      - name: Configure git
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - name: Update data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 scripts/update.py --commit

      # Push whatever was committed, even if one data source failed.
      - name: Push
        if: success() || failure()
        run: git push
